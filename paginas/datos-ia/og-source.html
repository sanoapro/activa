<!-- Molde de og.png (1200 × 630). Pensado para la miniatura de WhatsApp: pocas palabras,
     grandes, y todo el texto dentro de los 630 px del centro por si la recortan en cuadrado.
     A los lados solo va decoración. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Google Sans","Product Sans",Roboto,"Segoe UI",Arial,sans-serif;color:#fff;position:relative;text-align:center;
  background:radial-gradient(640px 380px at 100% 0%,rgba(66,133,244,.38),transparent 65%),radial-gradient(600px 360px at 0% 100%,rgba(52,168,83,.24),transparent 65%),#0f172a}
.puntos{position:absolute;inset:0;opacity:.55;background-image:radial-gradient(rgba(148,163,184,.4) 1.4px,transparent 1.8px);background-size:26px 26px;
  -webkit-mask-image:linear-gradient(90deg,#000 0,transparent 32%,transparent 68%,#000 100%);mask-image:linear-gradient(90deg,#000 0,transparent 32%,transparent 68%,#000 100%)}
.franja{position:absolute;left:0;right:0;top:0;height:12px;background:linear-gradient(90deg,#4285f4 0 25%,#ea4335 25% 50%,#fbbc04 50% 75%,#34a853 75% 100%)}
.logo{position:absolute;top:36px;left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:18px;background:#fff;display:flex;align-items:center;gap:16px}
.logo img{height:40px}
.logo .sep{width:2px;height:40px;background:#e3e5e8}
.logo img.cv{height:56px}
.sello{position:absolute;top:128px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:10px;padding:8px 20px;border-radius:999px;background:rgba(52,168,83,.18);border:2px solid rgba(129,201,149,.5);font-size:23px;font-weight:700;color:#c8f2d4;white-space:nowrap}
.sello svg{width:22px;height:22px;stroke:#81c995;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
h1{position:absolute;top:190px;left:0;right:0;font-size:78px;line-height:1.02;font-weight:700;letter-spacing:-3px}
h1 .ia i,.sello .ia i{font-style:normal}
.sello .ia i:nth-child(1){color:#8ab4f8}.sello .ia i:nth-child(2){color:#f28b82}
h1 .ia i:nth-child(1){color:#8ab4f8}h1 .ia i:nth-child(2){color:#f28b82}
.cifras{position:absolute;left:0;right:0;bottom:50px;display:flex;justify-content:center;gap:14px}
.cifras div{width:196px;padding:16px 10px 16px;border-radius:22px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.16);font-size:22px;font-weight:600;color:#cbd5e1;line-height:1.2}
.cifras b{display:block;font-size:46px;font-weight:700;letter-spacing:-1.5px;color:#fff;line-height:1.05;margin-bottom:4px}
.cifras div:nth-child(1){border-top:7px solid #4285f4}
.cifras div:nth-child(2){border-top:7px solid #ea4335}
.cifras div:nth-child(3){border-top:7px solid #34a853}

</head>
<body>
<div class="puntos"></div>
<div class="franja"></div>
<div class="logo"><img src="../../compartidos/img/marcas/activa.webp" alt="activa"><span class="sep"></span><img class="cv" src="../../compartidos/img/marcas/canva-reseller-partner.webp" alt="Certified Canva Reseller Partner"></div>
<div class="sello"><svg viewBox="0 0 24 24"><path d="M3.5 18.5l6-6 4 4L22 7"/></svg>Tecnología educativa e <span class="ia"><i>I</i><i>A</i></span></div>
<h1 style="font-size:64px;top:184px;line-height:1.06;letter-spacing:-1.6px">A la vanguardia<br>de la tecnología<br>educativa</h1>
<div class="cifras">
  <div><b>+10</b>años</div>
  <div><b>+2 M</b>docentes capacitados</div>
  <div><b>+100</b>colegios</div>
</div>
