<style>
/* ═══════════════════════════════════════════════════════════════
   KIT COMERCIAL · una sola lámina 1280×720, sin scroll.
   Hereda el sistema de diseño del deck (upgrade-edu/index.html):
   mismos tokens Google, misma tipografía, mismo pasto animado.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --blue:#1a73e8; --blue-d:#174ea6; --blue-t:#e8f0fe; --blue-l:#4285f4;
  --red:#ea4335;  --red-d:#b31412;  --red-t:#fce8e6;  --red-l:#f28b82;
  --yel:#f9ab00;  --yel-d:#b06000;  --yel-t:#fef7e0;  --yel-l:#fdd663;
  --grn:#1e8e3e;  --grn-d:#0d652d;  --grn-t:#e6f4ea;  --grn-l:#34a853;
  --plum:#7b1fa2; --plum-t:#f6ecfd;
  --teal:#00897b; --teal-t:#e0f2f1;
  --indigo:#3949ab; --indigo-t:#e8eaf6;
  --white:#fff; --ink:#202124; --ink2:#5f6368; --ink3:#80868b;
  --line:#dadce0; --line2:#e8eaed; --wash:#f8f9fa;
  --sh1:0 1px 2px rgba(60,64,67,.10), 0 4px 12px -4px rgba(60,64,67,.18);
  --sh2:0 2px 6px rgba(60,64,67,.10), 0 14px 34px -12px rgba(60,64,67,.24);
  --font:"Google Sans","Product Sans","Google Sans Text",Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#1b1c1e;font-family:var(--font);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow:hidden}

/* ---------- escenario: lámina fija, escalada al viewport ---------- */
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform:translate(-50%,-50%) scale(1);transform-origin:center center;
  background:var(--white);border-radius:12px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
  display:flex;flex-direction:column;
  /* el pie de 76 px queda libre para la pradera: el equipo nunca la pisa */
  padding:30px 46px 76px}

/* filete Google en el canto superior de la lámina */
#stage::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;z-index:9;
  background:linear-gradient(90deg,#4285f4 0 25%,#ea4335 25% 50%,#fbbc04 50% 75%,#34a853 75% 100%)}

/* ---------- fondo ---------- */
.bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.shape{position:absolute;border-radius:50%}

/* pasto (heredado del deck, diapositiva 22): cada brizna es un <g> doble —
   el exterior fija sitio y tamaño, el interior crece desde el suelo una vez
   y el path se mece a perpetuidad. */
.mv-pasto{position:absolute;left:0;right:0;bottom:0;height:78px}
.mv-pasto svg{display:block;width:100%;height:100%}
.mv-crece{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);
  animation:crece 2.4s cubic-bezier(.2,.7,.25,1) both}
@keyframes crece{to{transform:scaleY(1)}}
.mv-mece{transform-box:fill-box;transform-origin:50% 100%;
  animation:mece 6.5s ease-in-out infinite}
@keyframes mece{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

/* ---------- tipografía ---------- */
h1{font-size:38px;line-height:1.02;font-weight:500;letter-spacing:-1.5px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;
  letter-spacing:1.6px;text-transform:uppercase;color:var(--ink3)}
.eyebrow::before{content:"";width:18px;height:3px;border-radius:2px;background:currentColor}
.eyebrow.b{color:var(--blue)} .eyebrow.p{color:var(--plum)}

/* ---------- cabecera ---------- */
.kc-head{position:relative;z-index:2;display:flex;align-items:flex-end;
  justify-content:space-between;gap:26px;flex-shrink:0;padding-bottom:16px;
  border-bottom:1px solid var(--line2);margin-bottom:16px}
.kc-title{display:flex;flex-direction:column;gap:9px}
.kc-title h1 .g1{color:#4285f4}.kc-title h1 .g2{color:#ea4335}
.kc-title h1 .g3{color:#fbbc04}.kc-title h1 .g4{color:#34a853}
.kc-sub{font-size:13.5px;color:var(--ink2);line-height:1.35}
.kc-sub b{font-weight:600;color:var(--ink)}
.kc-brands{display:flex;align-items:center;gap:16px;flex-shrink:0}
.kc-brands img{height:26px;width:auto;display:block}
.kc-brands .bd{width:1px;height:26px;background:var(--line)}
.kc-brands .gfe{height:32px}

/* ---------- cuerpo ---------- */
.kc-body{position:relative;z-index:2;flex:1;min-height:0;
  display:flex;flex-direction:column;gap:16px}
.kc-sec{display:flex;flex-direction:column;gap:9px;min-height:0}
.kc-sec.venta{flex:1.26}
.kc-sec.interna{flex:1}
.kc-sechead{display:flex;align-items:center;gap:12px;flex-shrink:0}
.kc-sechead .rule{flex:1;height:1px;background:var(--line2)}
.kc-sechead .cnt{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--ink3)}
.kc-grid{flex:1;min-height:0;display:grid;gap:14px}
/* g5 queda disponible por si una fila crece a cinco: la lámina no crece, así que
   pasar de cuatro a cinco es cambiar la clase de la rejilla, no el alto. */
.kc-grid.g5{grid-template-columns:repeat(5,1fr)}
.kc-grid.g4{grid-template-columns:repeat(4,1fr)}
.kc-grid.g3{grid-template-columns:repeat(3,1fr)}

/* Lámina apartada: existe para que el equipo sepa que viene, pero no lleva a
   ningún lado todavía. Se ve en reposo, sin sombra ni reacción al cursor. */
.tile.pronto{background:var(--wash);border-style:dashed;box-shadow:none;cursor:default}
.tile.pronto .t-ico{background:var(--line2);box-shadow:none}
.tile.pronto .t-ico svg{fill:var(--ink3)}
.tile.pronto .t-name{color:var(--ink2)}
.tile.pronto .t-host{color:var(--ink3);font-style:italic}
.tile.pronto::after{background:var(--line)}

/* Botón hacia la segunda lámina del kit */
.kc-mas{display:inline-flex;align-items:center;gap:9px;height:36px;padding:0 16px;
  border-radius:99px;background:var(--white);border:1px solid var(--line);
  color:var(--ink2);text-decoration:none;font-size:13px;font-weight:600;
  box-shadow:var(--sh1);flex-shrink:0;
  transition:border-color .2s var(--ease),color .2s var(--ease),transform .2s var(--ease)}
.kc-mas:hover{border-color:var(--blue-l);color:var(--blue-d);transform:translateY(-1px)}
.kc-mas svg{width:16px;height:16px;fill:currentColor}
.kc-mas .n{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;
  border-radius:99px;background:var(--blue-t);color:var(--blue-d);font-size:10.5px;font-weight:700}

/* ---------- tarjeta de enlace ---------- */
.tile{position:relative;display:flex;flex-direction:column;gap:9px;
  padding:16px 17px 14px;border-radius:20px;text-decoration:none;color:inherit;
  background:var(--white);border:1px solid var(--line);box-shadow:var(--sh1);
  overflow:hidden;isolation:isolate;
  transition:box-shadow .22s,border-color .22s}
/* Envoltura doble para el motor de movimiento: la cascada (mo-stagger) anima
   .twrap, el imán desplaza .tmag y la inclinación gira la .tile. Cada capa
   tiene su propio transform y ninguna pisa a las demás. La entrada solo se
   oculta bajo html.mo-ready (regla 4): sin motor, todo se ve. */
.twrap{display:flex;min-width:0;min-height:0}
.tmag{display:flex;flex:1 1 auto;min-width:0}
.twrap .tile{flex:1 1 auto}
/* velo de color que se enciende al pasar el cursor */
.tile::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;
  background:radial-gradient(420px 240px at var(--mx,50%) var(--my,0%),var(--tint),transparent 70%);
  transition:opacity .25s}
/* la elevación en Y la pone ahora el imán del motor; aquí queda la sombra.
   Las tarjetas «pronto» no reaccionan: no deben sentirse clicables. */
.tile:not(.pronto):hover{box-shadow:var(--sh2);border-color:transparent}
.tile:not(.pronto):hover::before{opacity:1}
.tile:focus-visible{outline:3px solid var(--c);outline-offset:3px}
/* filete de color al pie de la tarjeta, crece al hover */
.tile::after{content:"";position:absolute;left:17px;bottom:0;height:4px;width:34px;
  border-radius:99px 99px 0 0;background:var(--c);transition:width .28s cubic-bezier(.2,.8,.2,1)}
.tile:not(.pronto):hover::after{width:calc(100% - 34px)}

.t-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.t-ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  background:var(--grad);box-shadow:0 6px 16px -6px var(--c);flex-shrink:0;
  transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.tile:not(.pronto):hover .t-ico{transform:scale(1.07) rotate(-4deg)}
.t-ico svg{width:25px;height:25px;fill:#fff;display:block}
.t-arrow{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--wash);color:var(--ink3);flex-shrink:0;
  transition:background .22s,color .22s,transform .28s cubic-bezier(.2,.8,.2,1)}
.t-arrow svg{width:15px;height:15px;fill:currentColor}
.tile:hover .t-arrow{background:var(--c);color:#fff;transform:translate(3px,-3px)}
.t-name{font-size:16.5px;font-weight:600;letter-spacing:-.35px;line-height:1.15}
.t-desc{font-size:12.5px;line-height:1.35;color:var(--ink2);flex:1}
.t-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.t-host{display:inline-flex;align-items:center;gap:5px;max-width:100%;
  font-size:10.5px;font-weight:600;letter-spacing:.2px;color:var(--c);
  background:var(--tint);border-radius:99px;padding:3.5px 9px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-host svg{width:11px;height:11px;fill:currentColor;flex-shrink:0}

/* botón copiar: vive dentro del <a>, pero cancela la navegación */
.t-copy{position:absolute;right:12px;bottom:11px;z-index:3;
  width:27px;height:27px;border-radius:9px;border:1px solid var(--line);
  background:var(--white);color:var(--ink3);cursor:pointer;display:grid;place-items:center;
  opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s,color .2s,border-color .2s}
.tile:hover .t-copy,.t-copy:focus-visible{opacity:1;transform:none}
.t-copy:hover{color:var(--c);border-color:var(--c)}
.t-copy svg{width:14px;height:14px;fill:currentColor;display:block}
.t-copy.ok{color:var(--grn);border-color:var(--grn)}
/* estado «copiado» del motor (Motion.botonEstado): el botón crece para
   decirlo con palabras y se queda visible mientras dura la confirmación,
   aunque el cursor salga de la tarjeta */
.t-copy.mo-done{opacity:1;transform:none;width:auto;min-width:27px;padding:0 9px;
  font-size:10.5px;font-weight:700;white-space:nowrap;font-family:var(--font);
  color:var(--grn);border-color:var(--grn)}

/* la tarjeta interna es más baja: se compacta */
.kc-sec.interna .tile{gap:7px;padding:14px 16px 12px}
.kc-sec.interna .t-ico{width:40px;height:40px;border-radius:12px}
.kc-sec.interna .t-ico svg{width:23px;height:23px}
.kc-sec.interna .t-name{font-size:15.5px}

/* ---------- equipo ---------- */
.kc-team{position:relative;z-index:2;flex-shrink:0;margin-top:13px;
  display:flex;align-items:center;gap:14px}
.kc-teamcap{flex-shrink:0;display:flex;flex-direction:column;gap:4px;
  padding-right:14px;border-right:1px solid var(--line2)}
.kc-teamcap .t{font-size:12.5px;font-weight:600;letter-spacing:-.2px}
.kc-teamcap .s{font-size:10.5px;color:var(--ink3);line-height:1.25}
.kc-people{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.p{display:flex;align-items:center;gap:8px;min-width:0}
.p img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;
  border:2.5px solid var(--pc);box-shadow:0 2px 8px -2px rgba(60,64,67,.4);
  transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.p:hover img{transform:scale(1.09)}
.p .d{min-width:0}
.p .n{font-size:11.5px;font-weight:600;letter-spacing:-.1px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .m{font-size:10px;color:var(--ink2);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .m a{color:inherit;text-decoration:none}
.p .m a:hover{color:var(--pc);text-decoration:underline}

/* ---------- aviso volante al copiar ---------- */
#toast{position:absolute;left:50%;bottom:26px;z-index:40;transform:translate(-50%,14px);
  background:#202124;color:#fff;font-size:12.5px;font-weight:500;
  padding:9px 18px;border-radius:99px;box-shadow:var(--sh2);
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .tile,.p{opacity:1!important;transform:none!important}
}
</style>
</head>

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function tarjeta(it){
  const c = css(it.color), t = css(it.tinte);
  /* Una lámina apartada no es un enlace: sin href no navega ni sale al tabular. */
  const a = document.createElement(it.pronto ? 'div' : 'a');
  a.className = it.pronto ? 'tile pronto' : 'tile';
  if(!it.pronto){ a.href = it.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; }
  a.style.setProperty('--c', c);
  a.style.setProperty('--tint', t);
  a.style.setProperty('--grad', `linear-gradient(135deg,${it.color2} 0%,${c} 100%)`);
  a.innerHTML =
    `<div class="t-top">
       <span class="t-ico"><svg viewBox="0 0 24 24" aria-hidden="true">${ICO[it.id]}</svg></span>
       ${it.pronto ? `` : `<span class="t-arrow"><svg viewBox="0 0 24 24" aria-hidden="true">${ICO_LINK}</svg></span>`}
     </div>
     <div class="t-name">${it.nombre}</div>
     <div class="t-desc">${it.desc}</div>
     <div class="t-foot">
       <span class="t-host">${it.pronto ? `` : `<svg viewBox="0 0 24 24" aria-hidden="true">${ICO_GLOBE}</svg>`}${it.host}</span>
     </div>
     ${it.pronto ? `` : `<button class="t-copy" type="button" title="Copiar enlace" aria-label="Copiar enlace de ${it.nombre}">
       <svg viewBox="0 0 24 24" aria-hidden="true">${ICO_COPY}</svg>
     </button>`}`;

  /* envoltura doble para el motor: la cascada anima .twrap, el imán mueve
     .tmag y la tarjeta conserva su propio transform para la inclinación */
  /* (el velo del cursor se pinta en veloPinta(), más abajo) */
  const w = document.createElement('div');
  w.className = 'twrap';
  const mag = document.createElement('div');
  mag.className = 'tmag';
  mag.appendChild(a);
  w.appendChild(mag);

  if(it.pronto) return w;   /* no hay enlace que copiar ni velo que seguir */

  /* El velo de color sigue al cursor dentro de la tarjeta.
     El listener SOLO guarda coordenadas (regla 2 de la normativa): el rectángulo
     se lee dentro del frame. Antes se leía aquí mismo, y ahora que la tarjeta
     lleva transform por frame —imán e inclinación— eso forzaría un cálculo de
     layout sincrónico en cada movimiento del cursor, justo mientras el bucle
     está escribiendo. Sin el motor no hay bucle, así que ahí se lee directo:
     el velo tiene que funcionar igual (regla 4). */
  a.addEventListener('pointermove', e=>{
    if(window.Motion){ velo.activa = a; velo.x = e.clientX; velo.y = e.clientY; return; }
    veloPinta(a, e.clientX, e.clientY);
  });
  a.addEventListener('pointerleave', ()=>{ if(velo.activa === a) velo.activa = null; });

  /* copiar sin navegar */
  const btn = a.querySelector('.t-copy');
  btn.addEventListener('click', ev=>{
    ev.preventDefault(); ev.stopPropagation();
    copiar(it.url, btn);
  });
  return w;
}

/* ═══════════ velo de color que sigue al cursor ═══════════
   `velo` guarda cuál tarjeta está bajo el cursor y en qué coordenada de
   viewport; quien pinta es veloPinta(), llamada una vez por frame desde el
   bucle del motor (ver el bloque de movimiento al final). Una sola lectura de
   geometría por frame, y solo mientras el cursor está sobre una tarjeta. */
const velo = { activa:null, x:0, y:0 };

function veloPinta(tile, cx, cy){
  const r = tile.getBoundingClientRect(), k = window.__scale || 1;
  tile.style.setProperty('--mx', ((cx - r.left) / k) + 'px');
  tile.style.setProperty('--my', ((cy - r.top)  / k) + 'px');
}

function pintar(cont, lista){
  const box = document.getElementById(cont);
  lista.forEach(it => box.appendChild(tarjeta(it)));
}

/* ═══════════ copiar al portapapeles ═══════════
   navigator.clipboard sólo existe en contexto seguro (https). El respaldo
   con textarea + execCommand mantiene el botón vivo en http:// y file://. */
const toast = document.getElementById('toast');
let toastT;
function avisar(msg){
  toast.textContent = msg;
  toast.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=>toast.classList.remove('on'), 1700);
}
function copiar(url, btn){
  const listo = ()=>{
    avisar('Enlace copiado');
    /* con el motor, el botón mismo dice «copiado» y vuelve solo;
       sin motor, se conserva el aviso original con el icono de palomita */
    if(btn._estado){ btn._estado(); return; }
    btn.classList.add('ok');
    btn.querySelector('svg').innerHTML = ICO_OK;
    setTimeout(()=>{ btn.classList.remove('ok'); btn.querySelector('svg').innerHTML = ICO_COPY; }, 1700);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(url).then(listo).catch(()=>respaldo(url, listo));
  } else respaldo(url, listo);
}
function respaldo(url, listo){
  const ta = document.createElement('textarea');
  ta.value = url;
  ta.style.cssText = 'position:fixed;top:-999px;opacity:0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); listo(); }
  catch(e){ avisar('No se pudo copiar'); }
  ta.remove();
}

/* ═══════════ escalado de la lámina ═══════════
   La diapositiva mide siempre 1280×720 y se encoge para caber entera:
   nunca hay scroll, ni en un monitor 4K ni en un celular. */
const stage = document.getElementById('stage');
function escalar(){
  const m = window.innerWidth < 700 ? 10 : 26;
  const k = Math.min((window.innerWidth - m*2)/1280, (window.innerHeight - m*2)/720);
  window.__scale = k;
  stage.style.transform = `translate(-50%,-50%) scale(${k})`;
}
escalar();
addEventListener('resize', escalar);

/* ═══════════ teclado ═══════════
   1–7 abre el acceso correspondiente; F alterna pantalla completa. */
const TODOS = [...VENTA, ...INTERNA];
addEventListener('keydown', e=>{
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const n = parseInt(e.key, 10);
  /* Las láminas apartadas no tienen destino: la tecla no hace nada en vez de
     abrir una pestaña en blanco. */
  if(n >= 1 && n <= TODOS.length){
    const destino = TODOS[n-1];
    if(destino.url) window.open(destino.url, '_blank', 'noopener');
    return;
  }
  if(e.key === 'd' || e.key === 'D'){ location.href = './descargables/'; return; }
  if(e.key === 'f' || e.key === 'F'){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  }
});

/* ═══════════ movimiento (motor compartido) ═══════════
   docs/normativa-motion.md. Opcional por diseño: si motion.js no cargó,
   la lámina ya se ve completa y quieta — nada de aquí condiciona el
   contenido (regla 4). Todo va dentro de la lámina escalada; el escalado
   de #stage no se toca: el imán y la inclinación viven en hijos internos. */
if(window.Motion){

  /* entrada en cascada: venta → interna → equipo, la coreografía de siempre */
  Motion.stagger(document.getElementById('gVenta'),   70, 90);
  Motion.stagger(document.getElementById('gInterna'), 70, 370);
  Motion.stagger(document.getElementById('team'),     55, 620);
  /* sin scroll no hace falta margen de anticipación: umbral cero */
  Motion.revealAll('.mo-stagger > *', { threshold: 0, rootMargin: '0px' });

  /* imán + inclinación en las tarjetas activas; las «pronto» se quedan
     quietas a propósito: no deben sentirse clicables */
  Motion.qsa('.twrap').forEach(w=>{
    const tile = w.querySelector('.tile');
    if(tile.classList.contains('pronto')) return;
    Motion.magnetic(w, w.querySelector('.tmag'), 120, 0.22);
    Motion.tilt(tile, 5);
  });

  /* el botón ⧉ confirma por sí mismo que copió (lo usa copiar(), arriba) */
  Motion.qsa('.t-copy').forEach(b=>{
    b._estado = Motion.botonEstado(b, { hecho:'✓ Copiado', msTrabajo:0, msHecho:1400 });
  });

  /* el velo del cursor: una lectura de geometría por frame, y solo si hay
     tarjeta bajo el cursor. El listener de pointermove ya guardó la coordenada */
  Motion.onFrame(()=>{ if(velo.activa) veloPinta(velo.activa, velo.x, velo.y); });

  Motion.start();   /* siempre lo último */
}
</script>
</body>
</html>
