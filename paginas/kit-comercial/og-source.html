<!doctype html>
<html lang="es-MX"><head><meta charset="utf-8">
<style>
:root{
  --blue:#1a73e8;--red:#ea4335;--yel:#f9ab00;--grn:#1e8e3e;
  --plum:#7b1fa2;--teal:#00897b;--indigo:#3949ab;
  --blue-t:#e8f0fe;--red-t:#fce8e6;--yel-t:#fef7e0;--grn-t:#e6f4ea;
  --ink:#202124;--ink2:#5f6368;--ink3:#80868b;--line:#dadce0;
  --font:"Google Sans","Product Sans",Roboto,"Segoe UI",system-ui,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#fff;font-family:var(--font);color:var(--ink)}
.card{position:relative;width:1200px;height:630px;overflow:hidden;display:flex;flex-direction:column;
  padding:62px 74px 0}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:9px;z-index:5;
  background:linear-gradient(90deg,#4285f4 0 25%,#ea4335 25% 50%,#fbbc04 50% 75%,#34a853 75% 100%)}
.sh{position:absolute;border-radius:50%}
.top{display:flex;align-items:center;justify-content:space-between;z-index:2}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:17px;font-weight:700;
  letter-spacing:2.6px;text-transform:uppercase;color:var(--blue)}
.eyebrow::before{content:"";width:30px;height:4px;border-radius:2px;background:currentColor}
.brands{display:flex;align-items:center;gap:22px}
.brands img{height:38px;width:auto;display:block}
.brands .gfe{height:46px}
.brands .bd{width:1px;height:38px;background:var(--line)}
h1{margin-top:30px;font-size:96px;line-height:1;font-weight:500;letter-spacing:-4px;z-index:2}
h1 .g1{color:#4285f4}h1 .g2{color:#ea4335}h1 .g3{color:#fbbc04}h1 .g4{color:#34a853}
.sub{margin-top:20px;font-size:29px;line-height:1.3;color:var(--ink2);max-width:800px;z-index:2}
.sub b{color:var(--ink);font-weight:600}
.row{margin-top:42px;display:flex;gap:15px;z-index:2}
.ico{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;
  box-shadow:0 10px 26px -10px rgba(60,64,67,.7)}
.ico svg{width:42px;height:42px;fill:#fff;display:block}
.pasto{position:absolute;left:0;right:0;bottom:0;height:96px;z-index:1}
.pasto svg{display:block;width:100%;height:100%}
</style></head><body>
<div class="card">
  <span class="sh" style="width:520px;height:520px;left:-220px;top:-250px;background:var(--blue-t);opacity:.65"></span>
  <span class="sh" style="width:400px;height:400px;right:-150px;top:-170px;background:var(--yel-t);opacity:.6"></span>
  <span class="sh" style="width:330px;height:330px;right:-130px;bottom:60px;background:var(--red-t);opacity:.45"></span>

  <div class="top">
    <span class="eyebrow">Equipo comercial · activa</span>
    <div class="brands">
      <img data-logo="activa" alt="activa">
      <span class="bd"></span>
      <img class="gfe" data-logo="gfepartner" alt="Google for Education Partner">
    </div>
  </div>

  <h1>Kit <span class="g1">c</span><span class="g2">o</span><span class="g3">m</span><span class="g4">e</span><span class="g1">r</span><span class="g2">c</span><span class="g3">i</span><span class="g4">a</span><span class="g1">l</span></h1>
  <p class="sub">Herramientas de venta, eventos y proceso interno — <b>los diez accesos en una sola pantalla.</b></p>

  <div class="row" id="row"></div>

  <div class="pasto"><svg viewBox="0 0 1200 96" preserveAspectRatio="none">
    <rect x="0" y="93" width="1200" height="3" fill="#34a853" opacity=".3"/>
    <g id="briznas"></g>
  </svg></div>
</div>

<script src="./assets.js"></script>
<script>
document.querySelectorAll("img[data-logo]").forEach(el=>{
  const s=(window.BRAND||{})[el.dataset.logo]; if(s) el.src=s; else el.remove();
});
const ICO={
 cotizador:'<path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm.8 3.2v3.4h10.4V5.2H6.8zm.4 6a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8zm4.8 0a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8zm4.8 0a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8zm-9.6 5a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8zm4.8 0a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8zm4.8 0a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8z"/>',
 base:'<path d="M3.5 4.5A1.5 1.5 0 0 1 5 3h14a1.5 1.5 0 0 1 1.5 1.5v15A1.5 1.5 0 0 1 19 21H5a1.5 1.5 0 0 1-1.5-1.5v-15zM5.4 4.9v3h13.2v-3H5.4zm0 4.8v3h4.9v-3H5.4zm6.7 0v3h6.5v-3h-6.5zm-6.7 4.8v3h4.9v-3H5.4zm6.7 0v3h6.5v-3h-6.5z"/>',
 taller:'<path d="M12 3 1.5 8.6 12 14.2l8.6-4.6v6.1h1.9V8.6L12 3zM5.2 12.4v3.9c0 .6.3 1.1.8 1.4 1.6 1 3.7 1.6 6 1.6s4.4-.6 6-1.6c.5-.3.8-.8.8-1.4v-3.9L12 16.1l-6.8-3.7z"/>',
 deck:'<path d="M2.6 3h18.8a1 1 0 0 1 0 2h-.6v9.5a1.7 1.7 0 0 1-1.7 1.7h-5.2l2.5 3.3a1 1 0 0 1-1.6 1.2L12 17.3l-2.8 3.4a1 1 0 0 1-1.6-1.2l2.5-3.3H4.9a1.7 1.7 0 0 1-1.7-1.7V5h-.6a1 1 0 0 1 0-2zm4.3 8.8a.9.9 0 0 0 1.8 0V9.4a.9.9 0 0 0-1.8 0v2.4zm3.8 0a.9.9 0 0 0 1.8 0V7.2a.9.9 0 0 0-1.8 0v4.6zm3.8 0a.9.9 0 0 0 1.8 0V10a.9.9 0 0 0-1.8 0v1.8z"/>',
 reembolso:'<path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h15A1.5 1.5 0 0 1 21 5.5v7.1a7 7 0 0 0-2-1.2V6H5v7h5.2a7 7 0 0 0-.2 1.6H4.5A1.5 1.5 0 0 1 3 13.1V5.5zm9 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm4.9 4.9a4.6 4.6 0 1 1 0 9.2 4.6 4.6 0 0 1-4.4-3.3.8.8 0 1 1 1.5-.5 3 3 0 1 0 .5-2.8h1a.8.8 0 0 1 0 1.6h-2.6a.8.8 0 0 1-.8-.8V13a.8.8 0 0 1 1.6 0v.4a4.6 4.6 0 0 1 3.2-1z"/>',
 crm:'<path d="M4 4.5h16A1.5 1.5 0 0 1 21.5 6v12A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18V6A1.5 1.5 0 0 1 4 4.5zm4.6 3a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8zM4.6 16.4c0-1.9 2-3 4-3s4 1.1 4 3v.4h-8v-.4zM15 8.6a.9.9 0 0 0 0 1.8h4a.9.9 0 0 0 0-1.8h-4zm0 3.5a.9.9 0 0 0 0 1.8h4a.9.9 0 0 0 0-1.8h-4z"/>',
 precios:'<path d="M11.4 2.6a2 2 0 0 0-1.4.6L3.2 9.9a2 2 0 0 0 0 2.8l8.1 8.1a2 2 0 0 0 2.8 0l6.7-6.7a2 2 0 0 0 .6-1.4V4.6a2 2 0 0 0-2-2h-8zm5.9 2.8a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 0 1 0-3.4zm-5.5 3.7c1 0 1.9.3 2.5.8l-.8 1.2a3 3 0 0 0-1.6-.5c-.6 0-1 .2-1 .6 0 1.2 3.6.6 3.6 3 0 1.1-.8 1.9-2 2.1v1.2h-1.3v-1.2c-1-.1-1.9-.5-2.5-1l.8-1.2c.6.5 1.3.8 2 .8.7 0 1.1-.2 1.1-.6 0-1.2-3.6-.6-3.6-3 0-1 .8-1.8 2-2V8.2h1.3v.9z"/>',
 formulario:'<path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm1.7 5.1a1.15 1.15 0 1 0 0 2.3 1.15 1.15 0 0 0 0-2.3zm3.4.2a.9.9 0 0 0 0 1.8h5.2a.9.9 0 0 0 0-1.8h-5.2zm-3.4 3.9a1.15 1.15 0 1 0 0 2.3 1.15 1.15 0 0 0 0-2.3zm3.4.2a.9.9 0 0 0 0 1.8h5.2a.9.9 0 0 0 0-1.8h-5.2zm-3.4 3.9a1.15 1.15 0 1 0 0 2.3 1.15 1.15 0 0 0 0-2.3zm3.4.2a.9.9 0 0 0 0 1.8h5.2a.9.9 0 0 0 0-1.8h-5.2z"/>',
 papas:'<path d="M8.2 4a2.6 2.6 0 1 1 0 5.2 2.6 2.6 0 0 1 0-5.2zm7.6 0a2.6 2.6 0 1 1 0 5.2 2.6 2.6 0 0 1 0-5.2zM3.4 17c0-2.3 2.5-3.6 4.8-3.6.9 0 1.9.2 2.7.6a5.9 5.9 0 0 0-1.1 3v1.6H3.4V17zm10.4 1.6V17c0-1.3.8-2.3 1.9-2.9a6 6 0 0 1 2.9-.7c2.3 0 4 1.3 4 3.6v1.6h-8.8zM12 13.9l-.5-.5c-1.4-1.3-2.3-2.1-2.3-3.1 0-.9.7-1.5 1.5-1.5.5 0 1 .2 1.3.6.3-.4.8-.6 1.3-.6.8 0 1.5.6 1.5 1.5 0 1-.9 1.8-2.3 3.1l-.5.5z"/>',
 ti:'<path d="M4.5 3h15A1.5 1.5 0 0 1 21 4.5v3.8A1.5 1.5 0 0 1 19.5 9.8h-15A1.5 1.5 0 0 1 3 8.3V4.5A1.5 1.5 0 0 1 4.5 3zm1.4 2.5a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8zm3.8.1a.9.9 0 0 0 0 1.8h7.6a.9.9 0 0 0 0-1.8H9.7zM4.5 11.6h15A1.5 1.5 0 0 1 21 13.1v3.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 16.9v-3.8a1.5 1.5 0 0 1 1.5-1.5zm1.4 2.5a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8zm3.8.1a.9.9 0 0 0 0 1.8h7.6a.9.9 0 0 0 0-1.8H9.7zM8 19.9h8a1 1 0 0 1 0 2H8a1 1 0 0 1 0-2z"/>'
};
const T=[['cotizador','#0d47a1','#1a73e8'],['precios','#a34400','#e8710a'],['deck','#8c1410','#ea4335'],
         ['papas','#004d40','#00897b'],['taller','#b06000','#f9ab00'],['formulario','#880e4f','#c2185b'],
         ['base','#0b5c28','#1e8e3e'],['crm','#004d40','#00897b'],['ti','#1a237e','#3949ab'],
         ['reembolso','#4a148c','#7b1fa2']];
document.getElementById('row').innerHTML = T.map(([k,a,b])=>
  `<span class="ico" style="background:linear-gradient(135deg,${a} 0%,${b} 100%)">
     <svg viewBox="0 0 24 24">${ICO[k]}</svg></span>`).join('');

/* pradera estática: en una imagen no hay animación, así que las briznas se
   dibujan ya crecidas y ligeramente inclinadas, con las alturas del deck. */
const COL=['#34a853','#fbbc04','#1e8e3e','#4285f4','#ea4335'];
const D=['M-8 0 C-5 -25 -2 -42 0 -58 C2 -42 5 -25 8 0 Z',
         'M-6 0 C-4 -15 -1 -26 0 -36 C1 -26 4 -15 6 0 Z',
         'M-7 0 C-2 -25 7 -42 16 -54 C7 -36 3 -19 7 0 Z',
         'M7 0 C2 -25 -7 -42 -16 -54 C-7 -36 -3 -19 -7 0 Z'];
let g='',x=18,i=0;
while(x<1200){
  const c=COL[(i*3+1)%COL.length], d=D[(i*5+2)%D.length];
  const s=(0.85+((i*7)%5)/12).toFixed(2), r=(((i*11)%7)-3);
  const op=(0.5+((i*3)%4)/16).toFixed(2);
  g+=`<g transform="translate(${x},96) scale(${s}) rotate(${r})"><path d="${d}" fill="${c}" opacity="${op}"/></g>`;
  x += 26 + (i%4)*13; i++;
}
document.getElementById('briznas').innerHTML=g;
</script>
</body></html>
