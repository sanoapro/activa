<!--
  Lámina 2 del kit comercial: PRIVADO. Lo que es para el equipo y no para
  proyectar: ligas para compartir, páginas internas y descargables. Es la
  misma lámina fija de 1280×720 que la pública, con las tarjetas del mismo
  tamaño en tres filas. «Privado» es una etiqueta, no una cerradura: GitHub
  Pages es público y cualquiera con la liga entra; por eso cada tarjeta dice
  si se puede mandar a un colegio.
  Para agregar algo: un registro en COMPARTIR, INTERNAS o DOCS, abajo.
  Antes vivía en descargables/, que ahora redirige aquí.
-->

<!-- Motor de movimiento compartido (docs/normativa-motion.md). Script clásico
     a propósito: la lámina se abre con doble clic desde file://. Si no carga,
     nada se oculta: la página se ve completa y quieta (regla 4). -->
<link rel="stylesheet" href="../../../compartidos/css/motion.css">
<script src="../../../compartidos/js/motion.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════════
   KIT COMERCIAL · PRIVADO · lámina 2, 1280×720, sin scroll.
   Mismo sistema que la lámina pública (../index.html): sus estilos se
   copiaron tal cual; lo propio de Privado va al final de este bloque.
   Hereda el sistema de diseño del deck (upgrade-edu/index.html):
   mismos tokens Google, misma tipografía, mismo pasto animado.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --blue:#1a73e8; --blue-d:#174ea6; --blue-t:#e8f0fe; --blue-l:#4285f4;
  --red:#ea4335;  --red-d:#b31412;  --red-t:#fce8e6;  --red-l:#f28b82;
  --yel:#f9ab00;  --yel-d:#b06000;  --yel-t:#fef7e0;  --yel-l:#fdd663;
  --grn:#1e8e3e;  --grn-d:#0d652d;  --grn-t:#e6f4ea;  --grn-l:#34a853;
  --plum:#7b1fa2; --plum-t:#f6ecfd;
  --teal:#00897b; --teal-t:#e0f2f1;
  --indigo:#3949ab; --indigo-t:#e8eaf6;
  /* el formulario de eventos entra noveno y los ocho colores ya estaban dados;
     el carmín es el único tono que no repite fila ni vecino */
  --pink:#c2185b; --pink-t:#fce4ec;
  /* precios entra décimo y va junto al azul del cotizador: el naranja es el que
     más se separa de su vecino, y el índigo —el otro libre— habría hecho pareja */
  --orange:#e8710a; --orange-t:#feefe3;
  --white:#fff; --ink:#202124; --ink2:#5f6368; --ink3:#80868b;
  --line:#dadce0; --line2:#e8eaed; --wash:#f8f9fa;
  --sh1:0 1px 2px rgba(60,64,67,.10), 0 4px 12px -4px rgba(60,64,67,.18);
  --sh2:0 2px 6px rgba(60,64,67,.10), 0 14px 34px -12px rgba(60,64,67,.24);
  --font:"Google Sans","Product Sans","Google Sans Text",Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#1b1c1e;font-family:var(--font);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow:hidden}

/* ---------- escenario: lámina fija, escalada al viewport ---------- */
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform:translate(-50%,-50%) scale(1);transform-origin:center center;
  background:var(--white);border-radius:12px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
  display:flex;flex-direction:column;
  /* el pie de 76 px queda libre para la pradera: el equipo nunca la pisa */
  padding:30px 46px 76px}

/* filete Google en el canto superior de la lámina */
#stage::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;z-index:9;
  background:linear-gradient(90deg,#4285f4 0 25%,#ea4335 25% 50%,#fbbc04 50% 75%,#34a853 75% 100%)}

/* ---------- fondo ---------- */
.bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.shape{position:absolute;border-radius:50%}

/* pasto (heredado del deck, diapositiva 22): cada brizna es un <g> doble —
   el exterior fija sitio y tamaño, el interior crece desde el suelo una vez
   y el path se mece a perpetuidad. */
.mv-pasto{position:absolute;left:0;right:0;bottom:0;height:78px}
.mv-pasto svg{display:block;width:100%;height:100%}
.mv-crece{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);
  animation:crece 2.4s cubic-bezier(.2,.7,.25,1) both}
@keyframes crece{to{transform:scaleY(1)}}
.mv-mece{transform-box:fill-box;transform-origin:50% 100%;
  animation:mece 6.5s ease-in-out infinite}
@keyframes mece{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

/* ---------- tipografía ---------- */
h1{font-size:38px;line-height:1.02;font-weight:500;letter-spacing:-1.5px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;
  letter-spacing:1.6px;text-transform:uppercase;color:var(--ink3)}
.eyebrow::before{content:"";width:18px;height:3px;border-radius:2px;background:currentColor}
.eyebrow.b{color:var(--blue)} .eyebrow.p{color:var(--plum)}
.eyebrow.y{color:var(--yel-d)}

/* ---------- cabecera ---------- */
.kc-head{position:relative;z-index:2;display:flex;align-items:flex-end;
  justify-content:space-between;gap:26px;flex-shrink:0;padding-bottom:16px;
  border-bottom:1px solid var(--line2);margin-bottom:16px}
.kc-title{display:flex;flex-direction:column;gap:9px}
.kc-title h1 .g1{color:#4285f4}.kc-title h1 .g2{color:#ea4335}
.kc-title h1 .g3{color:#fbbc04}.kc-title h1 .g4{color:#34a853}
.kc-sub{font-size:13.5px;color:var(--ink2);line-height:1.35}
.kc-sub b{font-weight:600;color:var(--ink)}
.kc-brands{display:flex;align-items:center;gap:16px;flex-shrink:0}
.kc-brands img{height:26px;width:auto;display:block}
.kc-brands .bd{width:1px;height:26px;background:var(--line)}
.kc-brands .gfe{height:32px}

/* ---------- cuerpo ----------
   Rejilla 3×3: tres bloques del mismo peso —venta, eventos, proceso interno—
   con tres accesos cada uno. Las tres secciones miden lo mismo (flex:1) porque
   ninguna manda sobre las otras; el orden ya cuenta la historia. Presupuesto:
   614 útiles − 121 de cabecera − 56 del equipo = 437 para .kc-body; menos los
   dos gaps de 12 quedan 413/3 ≈ 137 por sección, y de ahí 24 de encabezado + 7
   de gap dejan ≈ 106 px de alto por tarjeta. Ese número es el que obliga a la
   tarjeta horizontal de abajo. */
.kc-body{position:relative;z-index:2;flex:1;min-height:0;
  display:flex;flex-direction:column;gap:12px}
.kc-sec{flex:1;display:flex;flex-direction:column;gap:7px;min-height:0}
/* altura fija en el encabezado: el botón de descargables vive en una sola
   sección y sin este tope esa fila sería más baja que las otras dos */
.kc-sechead{display:flex;align-items:center;gap:12px;flex-shrink:0;height:24px}
.kc-sechead .rule{flex:1;height:1px;background:var(--line2)}
.kc-sechead .cnt{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--ink3)}
.kc-grid{flex:1;min-height:0;display:grid;gap:14px}
.kc-grid.g3{grid-template-columns:repeat(3,1fr)}
.kc-grid.g4{grid-template-columns:repeat(4,1fr)}

/* Las filas de cuatro —venta y eventos— miden 286 px por tarjeta y no 387: un
   punto menos de cuerpo en todo y el icono a 38. No es capricho de densidad
   —con el tamaño de la fila de tres, «Presentación comercial» se parte en dos
   líneas y la tarjeta rebasa los 106 px de alto que da la rejilla—. Cabe justo,
   y por eso las descripciones de esas filas se mantienen cortas. */
.kc-grid.g4 .tile{gap:11px;padding:12px 15px 11px}
.kc-grid.g4 .t-ico{width:38px;height:38px;border-radius:12px}
.kc-grid.g4 .t-ico svg{width:22px;height:22px}
.kc-grid.g4 .t-tx{padding-right:22px}
.kc-grid.g4 .t-name{font-size:15px}
.kc-grid.g4 .t-desc{font-size:11.5px;line-height:1.3}
.kc-grid.g4 .t-host{font-size:10px;padding:3px 8px}
/* el filete sigue arrancando donde arranca el texto: 15 de padding + 38 + 11 */
.kc-grid.g4 .tile::after{left:64px}
.kc-grid.g4 .tile:not(.pronto):hover::after{width:calc(100% - 79px)}

/* La fila de CINCO baja un punto más que la de cuatro: tarjetas de ≈229 px.
   Hoy ninguna franja la usa —venta y eventos van a cuatro, proceso interno a
   tres—, pero la densidad queda escrita para cuando una franja crezca. Mismo
   criterio que la nota de arriba: las descripciones se mantienen en una idea
   corta (≤ 2 líneas a 10.5 px) para no rebasar los ≈106 px de alto. */
.kc-grid.g5{grid-template-columns:repeat(5,1fr)}
.kc-grid.g5 .tile{gap:9px;padding:11px 12px 10px}
.kc-grid.g5 .t-ico{width:34px;height:34px;border-radius:11px}
.kc-grid.g5 .t-ico svg{width:20px;height:20px}
.kc-grid.g5 .t-tx{padding-right:26px}
.kc-grid.g5 .t-name{font-size:13px}
.kc-grid.g5 .t-desc{font-size:10.5px;line-height:1.28}
.kc-grid.g5 .t-host{font-size:9.5px;padding:3px 7px}
/* 12 de padding + 34 de icono + 9 de gap */
.kc-grid.g5 .tile::after{left:55px}
.kc-grid.g5 .tile:not(.pronto):hover::after{width:calc(100% - 67px)}

/* Lámina apartada: existe para que el equipo sepa que viene, pero no lleva a
   ningún lado todavía. Se ve en reposo, sin sombra ni reacción al cursor. */
.tile.pronto{background:var(--wash);border-style:dashed;box-shadow:none;cursor:default}
.tile.pronto .t-ico{background:var(--line2);box-shadow:none}
.tile.pronto .t-ico svg{fill:var(--ink3)}
.tile.pronto .t-name{color:var(--ink2)}
.tile.pronto .t-host{color:var(--ink3);font-style:italic}
.tile.pronto::after{background:var(--line)}

/* Botón hacia la segunda lámina del kit */
.kc-mas{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 12px;
  border-radius:99px;background:var(--white);border:1px solid var(--line);
  color:var(--ink2);text-decoration:none;font-size:12px;font-weight:600;
  box-shadow:var(--sh1);flex-shrink:0;
  transition:border-color .2s var(--ease),color .2s var(--ease),transform .2s var(--ease)}
.kc-mas:hover{border-color:var(--blue-l);color:var(--blue-d);transform:translateY(-1px)}
.kc-mas svg{width:14px;height:14px;fill:currentColor}
.kc-mas .n{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 5px;
  border-radius:99px;background:var(--blue-t);color:var(--blue-d);font-size:10.5px;font-weight:700}

/* ---------- tarjeta de enlace ----------
   Horizontal: con quince accesos cada fila es de cinco y la tarjeta mide
   ≈106 px de alto y ≈229 de ancho,
   y en esa proporción el icono encima del texto no cabe. Va al costado, y la
   tarjeta gana el ancho que el apilado desperdiciaba. */
.tile{position:relative;display:flex;flex-direction:row;align-items:flex-start;gap:13px;
  padding:13px 16px 12px;border-radius:18px;text-decoration:none;color:inherit;
  background:var(--white);border:1px solid var(--line);box-shadow:var(--sh1);
  overflow:hidden;isolation:isolate;
  transition:box-shadow .22s,border-color .22s}
/* Envoltura doble para el motor de movimiento: la cascada (mo-stagger) anima
   .twrap, el imán desplaza .tmag y la inclinación gira la .tile. Cada capa
   tiene su propio transform y ninguna pisa a las demás. La entrada solo se
   oculta bajo html.mo-ready (regla 4): sin motor, todo se ve. */
.twrap{display:flex;min-width:0;min-height:0}
.tmag{display:flex;flex:1 1 auto;min-width:0}
.twrap .tile{flex:1 1 auto}
/* velo de color que se enciende al pasar el cursor */
.tile::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;
  background:radial-gradient(420px 240px at var(--mx,50%) var(--my,0%),var(--tint),transparent 70%);
  transition:opacity .25s}
/* la elevación en Y la pone ahora el imán del motor; aquí queda la sombra.
   Las tarjetas «pronto» no reaccionan: no deben sentirse clicables. */
.tile:not(.pronto):hover{box-shadow:var(--sh2);border-color:transparent}
.tile:not(.pronto):hover::before{opacity:1}
/* La capa de enlace: cubre la tarjeta entera y queda por DEBAJO de la botonera
   (z-index 2 contra 3), así que el clic en un botón nunca es un clic en el
   enlace. El anillo de foco se dibuja aquí porque aquí es donde para el tabulador. */
.t-link{position:absolute;inset:0;z-index:2;border-radius:inherit}
.t-link:focus-visible{outline:3px solid var(--c);outline-offset:3px}
/* Filete de color al pie de la tarjeta, crece al hover. Arranca donde arranca
   el texto (16 de padding + 44 de icono + 13 de gap = 73) y no en el canto: con
   el icono ya al costado, un filete debajo de él duplicaba la misma mancha de
   color y se leía como una barra suelta. */
.tile::after{content:"";position:absolute;left:73px;bottom:0;height:4px;width:34px;
  border-radius:99px 99px 0 0;background:var(--c);transition:width .28s cubic-bezier(.2,.8,.2,1)}
.tile:not(.pronto):hover::after{width:calc(100% - 89px)}

/* columna de texto: reserva a la derecha el carril de la flecha y del botón ⧉,
   que ahora flotan los dos sobre el mismo canto. Se estira a todo el alto de la
   tarjeta —con el nombre arriba y la etiqueta de origen abajo, empujada por el
   margen automático del pie— para que las tres tarjetas de una fila alineen sus
   títulos y sus chips aunque una lleve una línea de descripción y otra dos. */
.t-tx{flex:1;min-width:0;align-self:stretch;
  display:flex;flex-direction:column;gap:3px;padding-right:24px}
.t-ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  background:var(--grad);box-shadow:0 6px 16px -6px var(--c);flex-shrink:0;
  transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.tile:not(.pronto):hover .t-ico{transform:scale(1.07) rotate(-4deg)}
.t-ico svg{width:25px;height:25px;fill:#fff;display:block}
.t-arrow{position:absolute;right:13px;top:12px;
  width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  background:var(--wash);color:var(--ink3);flex-shrink:0;
  transition:background .22s,color .22s,transform .28s cubic-bezier(.2,.8,.2,1)}
.t-arrow svg{width:14px;height:14px;fill:currentColor}
.tile:hover .t-arrow{background:var(--c);color:#fff;transform:translate(3px,-3px)}
.t-name{font-size:16px;font-weight:600;letter-spacing:-.35px;line-height:1.15}
.t-desc{font-size:12px;line-height:1.33;color:var(--ink2)}
.t-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:5px}
.t-host{display:inline-flex;align-items:center;gap:5px;max-width:100%;
  font-size:10.5px;font-weight:600;letter-spacing:.2px;color:var(--c);
  background:var(--tint);border-radius:99px;padding:3.5px 9px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-host svg{width:11px;height:11px;fill:currentColor;flex-shrink:0}

/* Botonera de la tarjeta: vive dentro del <a>, pero cancela la navegación.
   Los dos botones comparten carril para que el ⧉ no cambie de sitio en la
   tarjeta que además lleva QR. */
.t-acts{position:absolute;right:12px;bottom:10px;z-index:3;
  display:flex;align-items:center;gap:6px}

.t-copy{position:relative;z-index:3;
  width:27px;height:27px;border-radius:9px;border:1px solid var(--line);
  background:var(--white);color:var(--ink3);cursor:pointer;display:grid;place-items:center;
  opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s,color .2s,border-color .2s}
.tile:hover .t-copy,.t-copy:focus-visible{opacity:1;transform:none}
.t-copy:hover{color:var(--c);border-color:var(--c)}
.t-copy svg{width:14px;height:14px;fill:currentColor;display:block}
.t-copy.ok{color:var(--grn);border-color:var(--grn)}
/* estado «copiado» del motor (Motion.botonEstado): el botón crece para
   decirlo con palabras y se queda visible mientras dura la confirmación,
   aunque el cursor salga de la tarjeta */
.t-copy.mo-done{opacity:1;transform:none;width:auto;min-width:27px;padding:0 9px;
  font-size:10.5px;font-weight:700;white-space:nowrap;font-family:var(--font);
  color:var(--grn);border-color:var(--grn)}

/* ---------- aviso volante al copiar ---------- */
#toast{position:absolute;left:50%;bottom:26px;z-index:40;transform:translate(-50%,14px);
  background:#202124;color:#fff;font-size:12.5px;font-weight:500;
  padding:9px 18px;border-radius:99px;box-shadow:var(--sh2);
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .tile{opacity:1!important;transform:none!important}
}

/* ═══════════ lo propio de Privado ═══════════ */
/* Cabecera compacta: aquí el título no presume, solo ubica. */
.kc-head{align-items:center;padding-bottom:12px;margin-bottom:14px}
.kc-title{flex-direction:row;align-items:center;gap:14px}
.kc-title h1{font-size:28px;letter-spacing:-1px}
.kc-sub{font-size:12.5px}
.kc-volver{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 13px 0 10px;
  border-radius:99px;background:var(--white);border:1px solid var(--line);
  color:var(--ink2);text-decoration:none;font-size:12.5px;font-weight:600;box-shadow:var(--sh1);
  transition:border-color .2s,color .2s,transform .2s}
.kc-volver:hover{border-color:var(--blue-l);color:var(--blue-d);transform:translateX(-2px)}
.kc-volver svg{width:15px;height:15px;fill:currentColor}
.kc-brands img{height:22px}.kc-brands .gfe{height:27px}
/* Sin la franja del equipo, las tres filas se reparten todo el alto. */
.kc-body{gap:14px}
/* La etiqueta del pie dice A QUIÉN se le puede mandar, no de qué sitio viene. */
.t-host.si{color:var(--grn-d);background:var(--grn-t)}
.t-host.no{color:var(--red-d);background:var(--red-t)}
.t-host.si::before,.t-host.no::before{content:"";width:6px;height:6px;border-radius:50%;
  background:currentColor;flex-shrink:0}
/* PDF y Word del descargable: botones chicos al lado del ⧉, siempre a la vista */
.t-doc{display:inline-flex;align-items:center;height:27px;padding:0 9px;border-radius:9px;
  border:1px solid var(--c);background:var(--tint);color:var(--c);text-decoration:none;
  font-size:11px;font-weight:700;letter-spacing:.3px;transition:background .2s,color .2s,transform .2s}
.t-doc:hover{background:var(--c);color:#fff;transform:translateY(-1px)}
.t-doc:focus-visible{outline:3px solid var(--c);outline-offset:3px}
/* en pantallas táctiles no hay cursor que pasar: el ⧉ se ve siempre */
@media (hover:none){.t-copy{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="stage">

  <div class="bg" aria-hidden="true">
    <span class="shape" style="width:460px;height:460px;left:-190px;top:-210px;background:var(--plum-t);opacity:.6"></span>
    <span class="shape" style="width:340px;height:340px;right:-130px;top:-140px;background:var(--yel-t);opacity:.55"></span>
    <span class="shape" style="width:300px;height:300px;right:-120px;bottom:40px;background:var(--red-t);opacity:.4"></span>
    <div class="mv-pasto"><svg viewBox="0 0 1280 78" preserveAspectRatio="none">

<script>
/* ═══════════ marcas ═══════════ */
document.querySelectorAll("img[data-logo]").forEach(el=>{
  const src = (window.BRAND||{})[el.dataset.logo];
  if(src) el.src = src; else el.remove();
});

/* ═══════════ iconografía (retícula 24×24 de Material) ═══════════ */
const ICO = {
  /* cámara de video — una sesión en vivo por Meet */
  sesion:'<path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/>',

  /* capas — los cinco programas */
  programas:'<path d="M11.99 18.54 4.62 12.81 3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/>',
  /* flechas encontradas — la comparativa de competidores */
  comparativa:'<path d="M9.01 14H2v2h7.01v3L13 15l-3.99-4v3zm5.98-1v-3H22V8h-7.01V5L11 9l3.99 4z"/>',
  /* celular tachado — el acuerdo de la SEP sobre celulares */
  responsable:'<path d="M2.76 2.49 1.49 3.76 5 7.27V21c0 1.1.9 2 2 2h10c1.02 0 1.85-.77 1.98-1.75l1.26 1.26 1.27-1.27L2.76 2.49zM7 19V9.27L16.73 19H7zM17 5v9.17l2 2V3c0-1.1-.9-2-2-2H7c-.85 0-1.58.54-1.87 1.3L6.83 5H17z"/>',
  /* hoja firmada — la carta responsiva */
  responsiva:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zM8 13h8v1.6H8V13zm0 3.4h5.4V18H8v-1.6z"/>'
};
const ICO_LINK  = '<path d="M14 3a1 1 0 0 0 0 2h3.6l-8.3 8.3a1 1 0 0 0 1.4 1.4L19 6.4V10a1 1 0 0 0 2 0V3h-7zM5 5h5a1 1 0 0 1 0 2H6v11h11v-4a1 1 0 0 1 2 0v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>';
const ICO_COPY  = '<path d="M8 2h9a2 2 0 0 1 2 2v11a1 1 0 0 1-2 0V4H8a1 1 0 0 1 0-2zM5 6h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm0 2v12h8V8H5z"/>';
const ICO_OK    = '<path d="M9.6 16.2 5.4 12l-1.4 1.4 5.6 5.6L20.4 8.2 19 6.8z"/>';

/* ═══════════ las tres filas ═══════════
   aud:'si' = se puede mandar a un colegio · aud:'no' = solo equipo.
   pronto:true = todavía no existe: la tarjeta queda apartada, sin liga ni ⧉;
   cuando llegue la liga se quita `pronto` y se pone `url` y `aud`.
   Descripciones cortas: la tarjeta mide ≈106 px de alto. */
const COMPARTIR = [
  { id:'sesion', nombre:'Capacitación Canva', color:'--plum', color2:'#4a148c', tinte:'--plum-t',
    desc:'Invitación a la sesión del jueves 12 de noviembre, 5:00 pm, con Vicky Reyes.',
    aud:'si', vence:'2026-11-12',
    url:'https://sanoapro.github.io/activa/paginas/capacitacion-canva/' },
  { id:'video', nombre:'MasterClass de Gemini', color:'--blue', color2:'#0d47a1', tinte:'--blue-t',
    desc:'El uso básico de Gemini, la IA de Google, con el Mtro. Óscar Calderón.',
    aud:'si', url:'https://www.youtube.com/watch?v=UZ9BCrUveQ8' },
  { id:'video', nombre:'MasterClass de Canva', color:'--teal', color2:'#004d40', tinte:'--teal-t',
    desc:'La grabación de la capacitación de Canva, en cuanto se publique.',
    pronto:true }
];
const INTERNAS = [
  { id:'programas', nombre:'Los cinco programas', color:'--indigo', color2:'#1a237e', tinte:'--indigo-t',
    desc:'Qué es, qué resuelve y cómo se explica cada programa. Con PDF.',
    aud:'no', url:'https://sanoapro.github.io/activa/paginas/programas-activa/' },
  { id:'comparativa', nombre:'Comparativa de competidores', color:'--red', color2:'#8c1410', tinte:'--red-t',
    desc:'upgrade edu frente a Knotion, Santillana, AMCO y los demás, y cómo ganarles.',
    aud:'no', audTxt:'Solo equipo · no se manda',
    url:'https://sanoapro.github.io/activa/paginas/comparativa-competidores/' },
  { id:'responsable', nombre:'Uso responsable', color:'--orange', color2:'#a34400', tinte:'--orange-t',
    desc:'El acuerdo de la SEP sobre celulares, para familias y directivos.',
    aud:'si', url:'https://sanoapro.github.io/activa/paginas/uso-responsable/' }
];
/* Un documento de Google: con su id basta. La tarjeta abre «hacer una copia»
   y lleva PDF y Word al lado del ⧉. Quien recibe la liga copiada obtiene su
   propia copia, no la del que la mandó. */
const DOCS = [
  { id:'responsiva', nombre:'Carta Responsiva', color:'--blue', color2:'#0d47a1', tinte:'--blue-t',
    desc:'La que firma la familia al recibir el equipo. Se copia a tu Drive y se llena.',
    aud:'si', docId:'1Af5HAqxMHhvwioKueKfmusYatRRKtyMHPDsMqCPmgJA' }
];
DOCS.forEach(d=>{
  d.url  = `https://docs.google.com/document/d/${d.docId}/copy`;
  d.pdf  = `https://docs.google.com/document/d/${d.docId}/export?format=pdf`;
  d.word = `https://docs.google.com/document/d/${d.docId}/export?format=docx`;
});

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* La tarjeta es la misma de la lámina pública: un contenedor con una capa de
   enlace que la cubre y la botonera encima, como hermanas (nunca anidadas). */
function tarjeta(it){
  const c = css(it.color), t = css(it.tinte);
  const a = document.createElement('div');
  a.className = it.pronto ? 'tile pronto' : 'tile';
  a.style.setProperty('--c', c);
  a.style.setProperty('--tint', t);
  a.style.setProperty('--grad', `linear-gradient(135deg,${it.color2} 0%,${c} 100%)`);
  const etiqueta = it.pronto ? 'Próximamente'
    : (it.audTxt || (it.aud === 'si' ? 'Se puede mandar' : 'Solo equipo'));
  a.innerHTML =
    `${it.pronto ? `` : `<a class="t-link" href="${it.url}" target="_blank" rel="noopener noreferrer"
       aria-label="Abrir ${it.nombre} en una pestaña nueva"></a>`}
     <span class="t-ico"><svg viewBox="0 0 24 24" aria-hidden="true">${ICO[it.id]}</svg></span>
     <div class="t-tx">
       <div class="t-name">${it.nombre}</div>
       <div class="t-desc">${it.desc}</div>
       <div class="t-foot"><span class="t-host ${it.pronto ? '' : it.aud}">${etiqueta}</span></div>
     </div>
     ${it.pronto ? `` : `<span class="t-arrow"><svg viewBox="0 0 24 24" aria-hidden="true">${ICO_LINK}</svg></span>
     <div class="t-acts">
       ${it.pdf ? `<a class="t-doc" href="${it.pdf}" target="_blank" rel="noopener noreferrer" aria-label="Descargar ${it.nombre} en PDF">PDF</a>
       <a class="t-doc" href="${it.word}" target="_blank" rel="noopener noreferrer" aria-label="Descargar ${it.nombre} en Word">Word</a>` : ``}
       <button class="t-copy" type="button" title="Copiar enlace" aria-label="Copiar enlace de ${it.nombre}">
         <svg viewBox="0 0 24 24" aria-hidden="true">${ICO_COPY}</svg>
       </button>
     </div>`}`;

  const w = document.createElement('div');
  w.className = 'twrap';
  const mag = document.createElement('div');
  mag.className = 'tmag';
  mag.appendChild(a);
  w.appendChild(mag);
  if(it.pronto) return w;   /* no hay liga que copiar ni velo que seguir */

  a.addEventListener('pointermove', e=>{
    if(window.Motion){ velo.activa = a; velo.x = e.clientX; velo.y = e.clientY; return; }
    veloPinta(a, e.clientX, e.clientY);
  });
  a.addEventListener('pointerleave', ()=>{ if(velo.activa === a) velo.activa = null; });
  const btn = a.querySelector('.t-copy');
  btn.addEventListener('click', ev=>{
    ev.preventDefault(); ev.stopPropagation();
    copiar(it.url, btn);
  });
  return w;
}

/* ═══════════ velo de color que sigue al cursor ═══════════ */
const velo = { activa:null, x:0, y:0 };

function veloPinta(tile, cx, cy){
  const r = tile.getBoundingClientRect(), k = window.__scale || 1;
  tile.style.setProperty('--mx', ((cx - r.left) / k) + 'px');
  tile.style.setProperty('--my', ((cy - r.top)  / k) + 'px');
}


/* Cada fila pinta su lista y cuenta sus tarjetas. Las tres son de tres
   columnas, así que todas las tarjetas miden lo mismo aunque una fila traiga
   menos (Descargables lleva una). */
const FILAS = [['gCompartir','cntCompartir',COMPARTIR],['gInternas','cntInternas',INTERNAS],['gDocs','cntDocs',DOCS]];
FILAS.forEach(([g, n, lista])=>{
  const box = document.getElementById(g);
  lista.forEach(it => box.appendChild(tarjeta(it)));
  document.getElementById(n).textContent = String(lista.length).padStart(2,'0');
});

/* ═══════════ copiar al portapapeles ═══════════
   navigator.clipboard sólo existe en contexto seguro (https). El respaldo
   con textarea + execCommand mantiene el botón vivo en http:// y file://. */
const toast = document.getElementById('toast');
let toastT;
function avisar(msg){
  toast.textContent = msg;
  toast.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=>toast.classList.remove('on'), 1700);
}
function copiar(url, btn){
  const listo = ()=>{
    avisar('Enlace copiado');
    /* con el motor, el botón mismo dice «copiado» y vuelve solo;
       sin motor, se conserva el aviso original con el icono de palomita */
    if(btn._estado){ btn._estado(); return; }
    btn.classList.add('ok');
    btn.querySelector('svg').innerHTML = ICO_OK;
    setTimeout(()=>{ btn.classList.remove('ok'); btn.querySelector('svg').innerHTML = ICO_COPY; }, 1700);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(url).then(listo).catch(()=>respaldo(url, listo));
  } else respaldo(url, listo);
}
function respaldo(url, listo){
  const ta = document.createElement('textarea');
  ta.value = url;
  ta.style.cssText = 'position:fixed;top:-999px;opacity:0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); listo(); }
  catch(e){ avisar('No se pudo copiar'); }
  ta.remove();
}

/* ═══════════ escalado de la lámina ═══════════
   La diapositiva mide siempre 1280×720 y se encoge para caber entera:
   nunca hay scroll, ni en un monitor 4K ni en un celular. */
const stage = document.getElementById('stage');
function escalar(){
  const m = window.innerWidth < 700 ? 10 : 26;
  const k = Math.min((window.innerWidth - m*2)/1280, (window.innerHeight - m*2)/720);
  window.__scale = k;
  stage.style.transform = `translate(-50%,-50%) scale(${k})`;
}
escalar();
addEventListener('resize', escalar);

/* ═══════════ teclado ═══════════
   1–9 abren las tarjetas en el orden en que se leen (las apartadas no hacen
   nada). Esc vuelve al kit. F alterna pantalla completa. */
const TODOS = [...COMPARTIR, ...INTERNAS, ...DOCS];
addEventListener('keydown', e=>{
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key === 'Escape'){ location.href = '../'; return; }
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= TODOS.length){
    const d = TODOS[n-1];
    if(d.url && !d.pronto) window.open(d.url, '_blank', 'noopener');
    return;
  }
  if(e.key === 'f' || e.key === 'F'){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  }
});

/* ═══════════ movimiento (motor compartido) ═══════════
   docs/normativa-motion.md. Opcional: si motion.js no cargó, la lámina ya se
   ve completa y quieta. Mismo repertorio que la lámina pública. */
if(window.Motion){
  Motion.stagger(document.getElementById('gCompartir'), 70, 90);
  Motion.stagger(document.getElementById('gInternas'),  70, 260);
  Motion.stagger(document.getElementById('gDocs'),      70, 430);
  Motion.revealAll('.mo-stagger > *', { threshold: 0, rootMargin: '0px' });
  Motion.qsa('.twrap').forEach(w=>{
    const tile = w.querySelector('.tile');
    if(tile.classList.contains('pronto')) return;
    Motion.magnetic(w, w.querySelector('.tmag'), 120, 0.22);
    Motion.tilt(tile, 5);
  });
  Motion.qsa('.t-copy').forEach(b=>{
    b._estado = Motion.botonEstado(b, { hecho:'✓ Copiado', msTrabajo:0, msHecho:1400 });
  });
  Motion.onFrame(()=>{ if(velo.activa) veloPinta(velo.activa, velo.x, velo.y); });
  Motion.start();   /* siempre lo último */
}
</script>
</body>
