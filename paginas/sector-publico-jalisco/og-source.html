<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}

.cifras{position:absolute;left:64px;bottom:92px;display:flex;gap:12px}

.t .c.blanco{background:#fff}
.t .c img{width:30px;height:30px;object-fit:contain}
.t b{font-size:23px;line-height:1.1;font-weight:700}
