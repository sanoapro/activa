name: Compilar Fable

# Este repositorio NO se publica desde aquí.
#
# GitHub Pages está configurado para servir la rama `main` tal cual
# (Settings → Pages → Source: «Deploy from a branch»), y funciona porque la
# salida de Fable —paginas/motion-system/scripts/— se versiona a propósito. Por
# eso el sitio ya está completo en el repositorio: el portal index.html y todo
# lo que hay en paginas/ se sirve sin que nadie tenga que compilar nada.
#
# Antes este workflow intentaba además publicar con actions/deploy-pages, que
# exige que Pages esté en modo «GitHub Actions». Como no lo está, ese paso
# fallaba en cada push y llenaba de correos de error sin que el sitio se viera
# afectado. Se retiró.
#
# Lo que queda es una comprobación honesta: que el F# siga compilando. Si
# alguien rompe el F# del Motion System, el workflow avisa; si no, no molesta
# a nadie.
#
# Si algún día se prefiere que sea Actions quien publique, hay que cambiar
# Settings → Pages → Source a «GitHub Actions» y volver a añadir los pasos de
# upload-pages-artifact y deploy-pages, con los permisos pages/id-token.

on:
  push:
    branches: [main]
    paths:
      - 'paginas/motion-system/src/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compilar-fable
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Caché de NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.fsproj', '**/dotnet-tools.json') }}

      - name: Restaurar herramientas (Fable)
        run: dotnet tool restore

      # Se compila a una carpeta aparte: la salida buena es la que está
      # versionada en paginas/motion-system/scripts/, y no queremos que el CI la
      # pise ni genere ruido.
      - name: Compilar F# a JavaScript
        run: dotnet fable paginas/motion-system/src --outDir /tmp/fable-check --lang javascript

      - name: Recordatorio
        run: |
          echo "Compila correctamente."
          echo "Si cambiaste algo en paginas/motion-system/src/, recuerda compilar en local y hacer commit de la salida:"
          echo "  dotnet fable paginas/motion-system/src --outDir paginas/motion-system/scripts --lang javascript"
